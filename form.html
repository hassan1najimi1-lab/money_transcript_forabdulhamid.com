
<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#10213a">

  <title>Transfer Form | Northstar</title>

  <link rel="stylesheet" href="form.css">
  <script src="form.js" defer></script>
</head>

<body>

  <header class="header">
    <a class="brand" href="index.html">
      <span class="brand-icon">N</span>
      <span>Northstar<span class="dot">.</span></span>
    </a>

    <div class="header-actions">
      <button
        class="language-btn"
        id="languageToggle"
        type="button"
      >
        فارسی
      </button>

      <a
        class="back-link"
        href="index.html"
        data-en="← Back"
        data-fa="بازگشت ←"
      >← Back</a>
    </div>
  </header>

  <main class="page">
    <section class="form-card">

      <div class="form-heading">
        <span class="eyebrow"
          data-en="TRANSFER"
          data-fa="انتقال "
        > TRANSFER</span>

        <h1
          data-en="Transfer details"
          data-fa="جزئیات انتقال"
        >Transfer details</h1>

        <p
          data-en="Enter details to preview your transfer."
          data-fa="برای مشاهده انتقال، اطلاعات  را وارد کنید."
        >Enter sample details to preview your transfer.</p>
      </div>

      <div class="demo-notice"
        data-en="Please dont share this information with anyone"
        data-fa="لطفا مطمن شوید تا فرم را درست پر کردید در غیر اینصورت پول واپس نمیشود!"
      >
        This form does not send money. Do not enter bank
        passwords, card details, or other sensitive financial information.
      </div>

      <form id="transferForm">

        <div class="field">
          <label for="sender"
            data-en="Your name"
            data-fa="نام شما"
          >Your name</label>

          <input
            id="sender"
            name="sender"
            type="text"
            placeholder="Enter your name"
            data-placeholder-en="Enter your name"
            data-placeholder-fa="نام خود را وارد کنید"
            maxlength="70"
            autocomplete="name"
            required
          >
        </div>

        <div class="field">
          <label for="recipient"
            data-en="Recipient name"
            data-fa="نام دریافت‌کننده"
          >Recipient name</label>

          <input
            id="recipient"
            name="recipient"
            type="text"
            placeholder="Enter recipient name"
            data-placeholder-en="Enter recipient name"
            data-placeholder-fa="نام دریافت‌کننده را وارد کنید"
            maxlength="70"
            required
          >
        </div>

        <div class="field">
          <label for="amount"
            data-en="amount"
            data-fa="مبلغ نمونه"
          >amount</label>

          <div class="amount-field">
            <span id="currencySymbol">$</span>

            <input
              id="amount"
              name="amount"
              type="number"
              min="0.01"
              max="1000000"
              step="0.01"
              placeholder="0.00"
              required
            >
          </div>
        </div>

        <div class="field">
          <label for="currency"
            data-en="Currency"
            data-fa="واحد پول"
          >Currency</label>

          <select id="currency" name="currency">
            <option value="USD">USD — US Dollar</option>
            <option value="EUR">EUR — Euro</option>
            <option value="GBP">GBP — British Pound</option>
            <option value="AFN">AFN — Afghan Afghani</option>
          </select>
        </div>

        <div class="field">
          <label for="note"
            data-en="Note (optional)"
            data-fa="یادداشت (اختیاری)"
          >Note (optional)</label>

          <input
            id="note"
            name="note"
            type="text"
            maxlength="120"
            placeholder="What is this sample transfer for?"
            data-placeholder-en="What is this sample transfer for?"
            data-placeholder-fa="این انتقال  برای چه کاری است؟"
          >
        </div>

        <button
          class="submit-button"
          type="submit"
          data-en="Preview  Transfer →"
          data-fa="نمایش انتقال ←"
        >
          Transfer <Summary></Summary> →
        </button>

      </form>
    </section>
  </main>

  <footer class="footer"
    data-en="Northstar is a fictional demonstration. No banking services are provided."
    data-fa="نورث‌استار یک بانک با اعتماد و فرضی است.  خدمات بانکی ارائه شود."
  >
    
  </footer>

</body>
</html>
